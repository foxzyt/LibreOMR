name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Publish as a Draft Release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as a Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libreomr-linux-x86_64
            archive_ext: tar.gz
            generator: Ninja
            cc: gcc
            cxx: g++
            extra_cmake_flags: ""
          - os: windows-latest
            artifact_name: libreomr-windows-x86_64
            archive_ext: zip
            generator: "Visual Studio 17 2022"
            cc: ""
            cxx: ""
            extra_cmake_flags: ""
          - os: macos-latest
            artifact_name: libreomr-macos-arm64
            archive_ext: tar.gz
            generator: Ninja
            cc: clang
            cxx: clang++
            extra_cmake_flags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
          fi
          cmake -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist \
            -DLIBREOMR_BUILD_TESTS=ON \
            -DLIBREOMR_BUILD_CLI=ON \
            ${{ matrix.extra_cmake_flags }}

      - name: Build with 6 threads
        run: cmake --build build --config Release -j 6

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install into staging directory
        run: cmake --install build --config Release

      - name: Add Documentation and License to staging
        shell: bash
        run: |
          cp LICENSE dist/
          cp README.md dist/

      - name: Create Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C dist .
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Create Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact_name }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload Package as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.*
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRAFT="${{ github.event.inputs.draft }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            DRAFT="false"
            PRERELEASE="false"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "draft=${DRAFT}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Consolidate SHA-256 Checksums
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS.txt
          echo "Generated consolidated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Generate Release Notes Body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > release_body.md
            echo "" >> release_body.md
          else
            echo "## LibreOMR ${{ steps.vars.outputs.tag }}" > release_body.md
            echo "Optical Mark Recognition (OMR) library implemented in modern C++ with a pure C ABI." >> release_body.md
            echo "" >> release_body.md
          fi

          cat << 'EOF' >> release_body.md
          ### Precompiled Binary Packages

          | Platform | Architecture | Archive | Checksum |
          | :--- | :--- | :--- | :--- |
          | Linux | x86_64 | `libreomr-linux-x86_64.tar.gz` | [SHA256](SHA256SUMS.txt) |
          | Windows | x86_64 | `libreomr-windows-x86_64.zip` | [SHA256](SHA256SUMS.txt) |
          | macOS | Apple Silicon (arm64) | `libreomr-macos-arm64.tar.gz` | [SHA256](SHA256SUMS.txt) |

          ### Package Contents
          Every release package includes:
          - `bin/`: CLI binary (`libreomr`) and dynamic runtime libraries.
          - `lib/`: Import and shared/static library targets.
          - `include/libreomr/`: C++ header (`libreomr.hpp`) and C ABI header (`libreomr.h`).
          - `lib/cmake/LibreOMR/`: CMake package configuration for `find_package(LibreOMR REQUIRED)`.
          - `lib/pkgconfig/`: `libreomr.pc` for pkg-config.
          - `LICENSE`: GNU General Public License v3.0.
          - `README.md`: Documentation and code examples.

          ### Verifying Checksums
          To verify integrity, compare SHA-256 hashes against `SHA256SUMS.txt`:
          ```bash
          # Linux
          sha256sum -c SHA256SUMS.txt

          # macOS
          shasum -a 256 -c SHA256SUMS.txt

          # Windows PowerShell
          Get-FileHash -Algorithm SHA256 libreomr-*.zip
          ```

          ---
          *Copyright (C) 2026 Bernardo Alvim. Licensed under GNU General Public License v3.0.*
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "LibreOMR ${{ steps.vars.outputs.tag }}"
          body_path: release_body.md
          draft: ${{ steps.vars.outputs.draft == 'true' }}
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
