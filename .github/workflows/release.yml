name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    name: Package ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: libreomr-linux-x86_64
            archive_ext: tar.gz
            generator: Ninja
          - os: windows-latest
            artifact_name: libreomr-windows-x86_64
            archive_ext: zip
            generator: "Visual Studio 17 2022"
          - os: macos-latest
            artifact_name: libreomr-macos-universal
            archive_ext: tar.gz
            generator: Ninja

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=dist \
            -DLIBREOMR_BUILD_TESTS=ON \
            -DLIBREOMR_BUILD_CLI=ON

      - name: Build with 6 threads
        run: cmake --build build --config Release -j 6

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install to Staging
        run: cmake --install build --config Release

      - name: Copy Documentation and License
        shell: bash
        run: |
          cp LICENSE dist/
          cp README.md dist/

      - name: Create Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czvf "${{ matrix.artifact_name }}.tar.gz" -C dist .
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Create Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact_name }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.zip.sha256"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libreomr-*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
